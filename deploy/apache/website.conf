# The KulPay website (WEBSITE_PORT), once 'make start-website' runs it.
# A preview for the team: placeholder content, kept out of search engines.
# Enable once: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName site.kulpay.pavulla.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/site.kulpay.pavulla.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/site.kulpay.pavulla.com/privkey.pem

    Header always set X-Robots-Tag "noindex, nofollow"
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
