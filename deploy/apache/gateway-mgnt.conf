# The gateway's management port (GATEWAY_MGMT_PORT): its JSON management API
# and the operator dashboard at /admin/ (staff sign in with the workforce
# realm once GATEWAY_OIDC_ENABLED=true; make gateway-signin).
# Enable once: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName mgnt.kulpay.pavulla.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/mgnt.kulpay.pavulla.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mgnt.kulpay.pavulla.com/privkey.pem

    ProxyPreserveHost On
    # The dashboard's session cookie is Secure only behind https.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        / http://127.0.0.1:9981/
    ProxyPassReverse / http://127.0.0.1:9981/
</VirtualHost>
