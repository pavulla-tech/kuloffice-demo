# kulportal (KULPORTAL_PORT), once 'make start-portal' runs it.
# Enable once: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName portal.kulpay.pavulla.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/portal.kulpay.pavulla.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/portal.kulpay.pavulla.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        / http://127.0.0.1:9780/
    ProxyPassReverse / http://127.0.0.1:9780/
</VirtualHost>
