# The KulPay web app (WEB_PORT).
# Enable once: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName app.kulpay.pavulla.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/app.kulpay.pavulla.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/app.kulpay.pavulla.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    LimitRequestBody 52428800
    ProxyPass        / http://127.0.0.1:9380/
    ProxyPassReverse / http://127.0.0.1:9380/
</VirtualHost>
