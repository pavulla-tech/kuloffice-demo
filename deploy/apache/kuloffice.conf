# kuloffice's API (KULOFFICE_PORT): the mobile app and the token panel call it.
# Enable once: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName core.kulpay.pavulla.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/core.kulpay.pavulla.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/core.kulpay.pavulla.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    # KYC images are sent in the request body (up to 15 MB each, base64).
    LimitRequestBody 52428800
    ProxyTimeout 120
    ProxyPass        / http://127.0.0.1:9280/
    ProxyPassReverse / http://127.0.0.1:9280/
</VirtualHost>
