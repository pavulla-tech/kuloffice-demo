# Solange's console (SOLANGE_CONSOLE_PORT): staff sign in through the workforce realm.
# Enable once: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName console.qr.kulpay.pavulla.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/console.qr.kulpay.pavulla.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/console.qr.kulpay.pavulla.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        / http://127.0.0.1:9680/
    ProxyPassReverse / http://127.0.0.1:9680/
</VirtualHost>
