# Solange's scan edge and API (SOLANGE_PORT): what printed QR codes point at.
# Enable once: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName qr.kulpay.pavulla.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/qr.kulpay.pavulla.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/qr.kulpay.pavulla.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    # Solange trusts X-Forwarded-For from the stack's gateway only
    # (SOLANGE_TRUSTED_PROXIES); Apache sets it.
    # App links: the KulPay app claims https://qr.kulpay.pavulla.com/k/* once
    # the mobile team's files are in /srv/kulpay/well-known (assetlinks.json,
    # apple-app-site-association). Solange itself does not serve them.
    ProxyPass        /.well-known/ !
    Alias /.well-known/ /srv/kulpay/well-known/
    <Directory /srv/kulpay/well-known>
        Require all granted
    </Directory>
    <Files "apple-app-site-association">
        ForceType application/json
    </Files>
    ProxyPass        / http://127.0.0.1:9580/
    ProxyPassReverse / http://127.0.0.1:9580/
</VirtualHost>
