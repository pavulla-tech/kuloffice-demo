# The token panel (PANEL_PORT). It holds live tokens: never without the password.
# Create the password file once: htpasswd -c /etc/apache2/kulpay-panel.htpasswd <user>
# Enable once: a2enmod proxy proxy_http headers ssl auth_basic authn_file
<VirtualHost *:443>
    ServerName panel.kulpay.pavulla.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/panel.kulpay.pavulla.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/panel.kulpay.pavulla.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    <Location />
        AuthType Basic
        AuthName "KulPay token panel"
        AuthUserFile /etc/apache2/kulpay-panel.htpasswd
        Require valid-user
    </Location>
    ProxyPass        / http://127.0.0.1:9480/
    ProxyPassReverse / http://127.0.0.1:9480/
</VirtualHost>
