# The PSP simulator (SIMULATOR_PORT), development servers only. Whoever passes
# this password can approve top-ups, so it is never without one.
# Create the password file once: htpasswd -c /etc/apache2/kulpay-simulator.htpasswd <user>
# Enable once: a2enmod proxy proxy_http headers ssl auth_basic authn_file
<VirtualHost *:443>
    ServerName sim.kulpay.pavulla.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/sim.kulpay.pavulla.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sim.kulpay.pavulla.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    <Location />
        AuthType Basic
        AuthName "KulPay PSP simulator (development)"
        AuthUserFile /etc/apache2/kulpay-simulator.htpasswd
        Require valid-user
    </Location>
    # The gateway calls the provider APIs on the stack's network, never here.
    <LocationMatch "^/(mpesa|emola|card/v1)/">
        Require all denied
    </LocationMatch>
    ProxyPass        / http://127.0.0.1:9880/
    ProxyPassReverse / http://127.0.0.1:9880/
</VirtualHost>
