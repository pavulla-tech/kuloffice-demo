# Testes KulPay (TESTES_PORT): the plan and the record of the platform test.
# Everyone signs in with their own name: it is who ticked each step.
# Create the password file once: htpasswd -c /etc/apache2/kulpay-testes.htpasswd <user>
# Add a person: htpasswd /etc/apache2/kulpay-testes.htpasswd <user>
# Enable once: a2enmod proxy proxy_http headers ssl auth_basic authn_file
<VirtualHost *:443>
    ServerName testes.kulpay.pavulla.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/testes.kulpay.pavulla.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/testes.kulpay.pavulla.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    <Location />
        AuthType Basic
        AuthName "Testes KulPay"
        AuthUserFile /etc/apache2/kulpay-testes.htpasswd
        Require valid-user
    </Location>
    # Who signed in, for the record; a header from the browser never gets through.
    RequestHeader unset X-Remote-User
    RequestHeader set X-Remote-User "%{REMOTE_USER}s"
    ProxyPass        / http://127.0.0.1:9890/
    ProxyPassReverse / http://127.0.0.1:9890/
</VirtualHost>
