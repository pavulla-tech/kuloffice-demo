# Testes KulPay (TESTES_PORT): the plan and the record of the platform test.
# Sign-in is the platform's own, through Keycloak (the testes realm, made by
# make testes-signin): Apache no longer asks for a password.
# Enable once: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName testes.kulpay.pavulla.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/testes.kulpay.pavulla.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/testes.kulpay.pavulla.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    # Evidence uploads: photos and short videos, up to 15 MB each.
    LimitRequestBody 104857600
    ProxyPass        / http://127.0.0.1:9890/
    ProxyPassReverse / http://127.0.0.1:9890/
</VirtualHost>
