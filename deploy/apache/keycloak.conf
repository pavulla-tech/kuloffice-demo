# Keycloak (KEYCLOAK_PORT). The issuer: keep the hostname.
# Enable once: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName auth.kulpay.pavulla.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/auth.kulpay.pavulla.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/auth.kulpay.pavulla.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    # Passkeys from the apps: serve intaka's assetlinks.json here if enabled
    # (see intaka demo/deploy README, step 5).
    # Alias /.well-known/assetlinks.json /srv/kulpay/assetlinks.json
    ProxyPass        / http://127.0.0.1:9180/
    ProxyPassReverse / http://127.0.0.1:9180/
</VirtualHost>
