# KulPay login theme.
#
# Extends Keycloak's own base/login theme rather than replacing it: `parent`
# inherits every template we do not override, so a Keycloak upgrade that adds a
# screen (a new required action, a new credential type) keeps working instead of
# rendering blank. We override the SHELL and the CSS, not the form logic.
# This copy is the Keycloak 26 variant of the theme in katembe-payments. The two
# differ only in `parent` (and therefore in which PatternFly major is underneath:
# v4 for the v1 theme, v5 for v2). The override block at the end of kulpay.css
# already targets both prefixes, which is why the port is a one-line change.
# Was parent=keycloak (the v1 login theme). v1 was REMOVED in Keycloak 26, and
# naming a parent the server does not have makes the theme silently resolve to
# the built-in one — which looks exactly like the theme being ignored. This demo
# runs 26.7.4, so it inherits keycloak.v2.
parent=keycloak.v2
import=common/keycloak

# Only our stylesheet. The default Keycloak/PatternFly CSS is deliberately NOT
# imported — loading both means fighting its specificity on every rule.
# The query is a cache key. Keycloak serves theme files for 30 days under a path
# that changes only with Keycloak's own version, so without it a phone keeps an
# old kulpay.css for a month after a change. Change it with every CSS change.
styles=css/kulpay.css?v=2026-10-02

# Self-hosted webfont; no external requests. Keycloak's default CSP allows
# 'self' font sources.
kcHtmlClass=kulpay
kcLoginClass=kulpay-login
