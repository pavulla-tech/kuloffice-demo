# KulPay on one server, in one compose stack: Keycloak, kuloffice, the web app,
# the token panel, Solange (QR codes) and its console, MinIO behind a boquisso
# file server, and Postgres for all of them. kulportal is ready to switch on
# (profile `portal`).
#
# Run it through the Makefile (`make help`): it passes .env and checks it.
#
# Apache on the host terminates TLS. Every service is published on 127.0.0.1
# only, on the ports in .env, and Apache's vhosts proxy to them (see apache/).
# The server never builds: every image is built on a laptop and pulled from
# Docker Hub (make images / make push there, make update here).

# The project's own name, not its folder's: the Keycloak kit this replaces
# also lives in a folder called deploy, and sharing a project name would let
# `make stop` or `make clean` here remove its containers and volumes.
name: kulpay

x-restart: &restart
  restart: unless-stopped
  networks: [kulpay]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

networks:
  kulpay:
    # A fixed subnet, so services can trust what arrives from the host (Apache)
    # by address: it reaches them through this network's gateway.
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-10.250.0.0/24}
          gateway: ${STACK_GATEWAY:-10.250.0.1}

volumes:
  db-data:
  blnk-redis-data:
  blnk-typesense-data:
  gateway-config:
  simulator-data:
  minio-data:
  token-panel-data:

services:
  # One Postgres for every service, each with its own database and role
  # (db/init.sh, on the first start only).
  db:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      KULOFFICE_DB_PASSWORD: ${KULOFFICE_DB_PASSWORD:?set KULOFFICE_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      SOLANGE_DB_PASSWORD: ${SOLANGE_DB_PASSWORD:?set SOLANGE_DB_PASSWORD}
      BLNK_DB_PASSWORD: ${BLNK_DB_PASSWORD:?set BLNK_DB_PASSWORD}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  blnk-db-init:
    image: postgres:17-alpine
    networks: [kulpay]
    depends_on:
      db: { condition: service_healthy }
    environment:
      POSTGRES_USER: postgres
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      BLNK_DB_PASSWORD: ${BLNK_DB_PASSWORD}
    volumes:
      - ./db/init-blnk.sh:/init-blnk.sh:ro
    entrypoint: ["/bin/sh", "/init-blnk.sh"]

  # ---- financial core --------------------------------------------------------

  # BLNK's database is isolated inside the shared Postgres instance. Redis is
  # its durable work queue; Typesense is a rebuildable search projection.
  blnk-redis:
    <<: *restart
    image: redis:7.2.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - blnk-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  blnk-typesense:
    <<: *restart
    image: typesense/typesense:29.0
    command: ["--data-dir", "/data", "--api-key=${BLNK_TYPESENSE_API_KEY:?set BLNK_TYPESENSE_API_KEY}", "--listen-port", "8108"]
    volumes:
      - blnk-typesense-data:/data
    healthcheck:
      # The image has neither curl nor wget; bash's /dev/tcp asks /health.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"ok\":true' <&3"]
      interval: 5s
      timeout: 5s
      retries: 20

  blnk-server:
    <<: *restart
    image: ${BLNK_IMAGE:-jerryenebeli/blnk}:${BLNK_TAG:?set BLNK_TAG}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["blnk migrate up && exec blnk start"]
    depends_on:
      blnk-db-init: { condition: service_completed_successfully }
      blnk-redis: { condition: service_healthy }
      blnk-typesense: { condition: service_healthy }
    environment: &blnk-environment
      BLNK_PROJECT_NAME: KulPay
      BLNK_DATA_SOURCE_DNS: postgres://blnk:${BLNK_DB_PASSWORD}@db:5432/blnk?sslmode=disable
      BLNK_REDIS_DNS: blnk-redis:6379
      BLNK_TYPESENSE_DNS: http://blnk-typesense:8108
      BLNK_TYPESENSE_KEY: ${BLNK_TYPESENSE_API_KEY}
      BLNK_SERVER_PORT: "5001"
      BLNK_SERVER_SECURE: "true"
      BLNK_SERVER_SECRET_KEY: ${BLNK_SERVER_SECRET_KEY:?set BLNK_SERVER_SECRET_KEY}
      BLNK_TOKENIZATION_SECRET: ${BLNK_TOKENIZATION_SECRET:?set BLNK_TOKENIZATION_SECRET}
      BLNK_ENABLE_TELEMETRY: "false"
      BLNK_ENABLE_OBSERVABILITY: "false"
    healthcheck:
      # BLNK has no route at / or /health (both 404); listing one ledger is
      # what kuloffice's bootstrap does, and proves the key and the database.
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=\"X-Blnk-Key: $$BLNK_SERVER_SECRET_KEY\" 'http://127.0.0.1:5001/ledgers?limit=1&offset=0'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # This is BLNK's own queue processor, not the KulOffice instruction worker.
  # Both use the same immutable image and configuration.
  blnk-worker:
    <<: *restart
    image: ${BLNK_IMAGE:-jerryenebeli/blnk}:${BLNK_TAG}
    entrypoint: ["blnk", "workers"]
    depends_on:
      blnk-server: { condition: service_healthy }
    environment: *blnk-environment

  # ---- payments (development) --------------------------------------------------

  # KulPay's own payments gateway instance, separate from the merchant
  # gateway deployment. Internal only: kuloffice is its one client. Its live
  # M-Pesa, e-Mola and card bindings point at the PSP simulator below, so on
  # this server simulated payments are live payments. Never copy this block
  # onto a server with real provider credentials.
  gateway-db-init:
    image: postgres:17-alpine
    networks: [kulpay]
    depends_on:
      db: { condition: service_healthy }
    environment:
      POSTGRES_USER: postgres
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD}
    volumes:
      - ./db/init-gateway.sh:/init-gateway.sh:ro
    entrypoint: ["/bin/sh", "/init-gateway.sh"]

  # API keys are a list, which the gateway reads only from its YAML file; this
  # writes that file from .env on every start (secrets stay in .env).
  gateway-config:
    image: postgres:17-alpine
    networks: [kulpay]
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?set GATEWAY_API_KEY}
      GATEWAY_ADMIN_KEY: ${GATEWAY_ADMIN_KEY:?set GATEWAY_ADMIN_KEY}
      GATEWAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:?set GATEWAY_ENCRYPTION_KEY}
    volumes:
      - gateway-config:/config
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for k in "$$GATEWAY_API_KEY" "$$GATEWAY_ADMIN_KEY"; do
          case $$k in *[!0-9a-f]* | "") echo "gateway keys must be hex (openssl rand -hex 32)" >&2; exit 1 ;; esac
        done
        # Live mode refuses to start without a 32-byte key; say so here, plainly.
        if [ "$$(printf %s "$$GATEWAY_ENCRYPTION_KEY" | base64 -d 2>/dev/null | wc -c)" -ne 32 ]; then
          echo "GATEWAY_ENCRYPTION_KEY must be base64 of 32 bytes (openssl rand -base64 32)" >&2; exit 1
        fi
        umask 022
        cat > /config/kulpay-payments.yaml.tmp <<EOF
        keys:
          - id: kuloffice
            secret: "$$GATEWAY_API_KEY"
            mode: live
            label: "kuloffice top-ups"
            scopes: [payments:read, payments:write]
            rate_per_minute: 600
          - id: operator
            secret: "$$GATEWAY_ADMIN_KEY"
            mode: live
            label: "connector bindings"
            scopes: [admin:read, connectors:read, connectors:write]
            rate_per_minute: 60
        EOF
        mv /config/kulpay-payments.yaml.tmp /config/kulpay-payments.yaml

  gateway:
    <<: *restart
    image: ${GATEWAY_IMAGE:-localhost/kulpay-gateway}:${GATEWAY_TAG:?set GATEWAY_TAG}
    depends_on:
      gateway-db-init: { condition: service_completed_successfully }
      gateway-config: { condition: service_completed_successfully }
    command: ["--config", "/etc/kulpay/kulpay-payments.yaml"]
    environment:
      KULPAY_MODE: live
      KULPAY_DB_URL: &gateway-db postgres://gateway:${GATEWAY_DB_PASSWORD}@db:5432/gateway?sslmode=disable
      KULPAY_DATABASE_URL: *gateway-db
      KULPAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:?set GATEWAY_ENCRYPTION_KEY}
      KULPAY_ENCRYPTION_KEY_ID: dev-1
      KULPAY_ADDR: ":9090"
      KULPAY_MGMT_ADDR: ":9091"
      KULPAY_EXTERNAL_URL: http://gateway:9090
      KULPAY_DEFAULT_CURRENCY: MZN
      KULPAY_DEFAULT_COUNTRY: MZ
      KULPAY_ACCOUNT_NAME: KulPay
      KULPAY_LOG_FORMAT: json
      KULPAY_OIDC_ENABLED: "false"
      # Every rail is a database binding (gateway-bind). Operator-confirmed
      # "manual" payments would be money that never crossed a rail: off.
      KULPAY_CONNECTORS_MANUAL_ENABLED: "false"
    volumes:
      - gateway-config:/etc/kulpay:ro
    healthcheck:
      test: ["CMD", "kulpay-payments", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    stop_grace_period: 60s

  # Points the gateway's live bindings at the simulator. Idempotent: the
  # gateway keeps each binding's ID, which kuloffice's collection balances use.
  gateway-bind:
    image: ${SIMULATOR_IMAGE:-localhost/kulpay-psp-simulator}:${SIMULATOR_TAG:?set SIMULATOR_TAG}
    networks: [kulpay]
    depends_on:
      gateway: { condition: service_healthy }
      simulator: { condition: service_healthy }
    command: ["bind"]
    environment:
      BIND_GATEWAY_ADMIN_URL: http://gateway:9091
      BIND_ADMIN_KEY: ${GATEWAY_ADMIN_KEY}
      BIND_SIMULATOR_URL: http://simulator:8085
      BIND_MODE: live

  # Development only: plays M-Pesa, e-Mola and the card acquirer, and their
  # customers. Its page (SIMULATOR_PUBLIC_URL) is where someone approves or
  # declines a top-up; Apache must put a password in front of it.
  simulator:
    <<: *restart
    image: ${SIMULATOR_IMAGE:-localhost/kulpay-psp-simulator}:${SIMULATOR_TAG}
    environment:
      SIMULATOR_ADDR: ":8085"
      SIMULATOR_PUBLIC_URL: ${SIMULATOR_PUBLIC_URL:?set SIMULATOR_PUBLIC_URL}
      SIMULATOR_HOLD_SECONDS: "60"
      SIMULATOR_DEFAULT_BALANCE_MINOR: "5000000"
    volumes:
      - simulator-data:/data
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-9880}:8085"
    healthcheck:
      test: ["CMD", "kulpay-psp-simulator", "health"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---- identity ---------------------------------------------------------------

  keycloak:
    <<: *restart
    image: ${KEYCLOAK_IMAGE:-developerspavs/kulpay-keycloak}:${KEYCLOAK_TAG:?set KEYCLOAK_TAG}
    depends_on:
      db: { condition: service_healthy }
    command:
      - start
      - --optimized
      # Real SMS: codes cost money and go to real handsets.
      - --spi-phone-auth-sms-sender--provider=http
      - --spi-phone-auth-sms-sender--http--base-url=${OLA_SMS_BASE_URL:?set OLA_SMS_BASE_URL}
      - --spi-phone-auth-sms-sender--http--api-key=${OLA_SMS_API_KEY:?set OLA_SMS_API_KEY}
      - --spi-phone-auth-sms-sender--http--provider-id=${OLA_SMS_PROVIDER_ID:?set OLA_SMS_PROVIDER_ID}
      # Origins the mobile apps present during a passkey ceremony (see .env).
      - --spi-phone-auth-app-origins=${PASSKEY_APP_ORIGINS:-}
      - --log-level=INFO,com.pavulla.keycloak.phoneauth:${KC_PHONEAUTH_LOG_LEVEL:-info}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # The public URL: the token issuer and the passkey rpId. Changing it
      # later invalidates every token and passkey.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?set KEYCLOAK_PUBLIC_URL}
      # Behind Apache: plain HTTP inside, scheme and host from the forwarded
      # headers (the vhost must send X-Forwarded-Proto: https).
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD}
    # The KulPay login theme the mobile app's look comes from. Images built
    # since CI carry it, and a deploy copies it out of the image it runs into
    # state/theme (KEYCLOAK_THEME_DIR), so theme and templates always match.
    # Before that: ./theme/kulpay, copied from intaka by `make theme`.
    volumes:
      - ${KEYCLOAK_THEME_DIR:-./theme/kulpay}:/opt/keycloak/themes/kulpay:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-9180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---- files ------------------------------------------------------------------

  # MinIO no longer publishes images: these are copies of the official ones
  # in our namespace (see .env).
  minio:
    <<: *restart
    image: ${MINIO_IMAGE:-developerspavs/kulpay-minio}:${MINIO_TAG:?set MINIO_TAG}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kulpay}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # kuloffice's buckets. Images wait in the pending bucket until a submission
  # is accepted; its lifecycle rule removes what never is. Idempotent.
  minio-init:
    image: ${MC_IMAGE:-developerspavs/kulpay-mc}:${MC_TAG:?set MC_TAG}
    networks: [kulpay]
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kulpay}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      KYC_BUCKET: ${KYC_BUCKET:-kyc}
      PENDING_BUCKET: ${PENDING_BUCKET:-kyc-pending}
      PENDING_EXPIRY_DAYS: ${PENDING_EXPIRY_DAYS:-1}
      LOGO_BUCKET: ${LOGO_BUCKET:-logos}
    entrypoint:
      - sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$KYC_BUCKET" "local/$$PENDING_BUCKET" "local/$$LOGO_BUCKET"
        if mc ilm rule ls "local/$$PENDING_BUCKET" 2>/dev/null | grep -q Expir; then
          echo "lifecycle rule on $$PENDING_BUCKET already set"
        else
          mc ilm rule add --expire-days "$$PENDING_EXPIRY_DAYS" "local/$$PENDING_BUCKET"
        fi

  # boquisso-fileserver, KulPay's own: the HTTP API kuloffice stores files
  # through. Internal only.
  fileserver:
    <<: *restart
    image: ${FILESERVER_IMAGE:-developerspavs/kulpay-fileserver}:${FILESERVER_TAG:?set FILESERVER_TAG}
    depends_on:
      minio-init: { condition: service_completed_successfully }
    environment:
      API_PORT: "8080"
      ENDPOINT: minio:9000
      ACCESS_KEY_ID: ${MINIO_ROOT_USER:-kulpay}
      SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      USE_SSL: "false"

  # ---- kuloffice ----------------------------------------------------------------

  kuloffice:
    <<: *restart
    image: ${KULOFFICE_IMAGE:-developerspavs/kulpay-kuloffice}:${KULOFFICE_TAG:?set KULOFFICE_TAG}
    depends_on:
      db: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      fileserver: { condition: service_started }
      blnk-server: { condition: service_healthy }
      # Top-ups need the gateway's bindings in place (they run on every start).
      gateway-bind: { condition: service_completed_successfully }
    # Anything else kuloffice reads (KULOFFICE_*): MiniAiLive, BLNK, NUIB API,
    # idfort, SMS templates. Optional; see kuloffice.env.example. The settings
    # below win over it.
    env_file:
      - path: kuloffice.env
        required: false
    environment:
      KULOFFICE_ENVIRONMENT: ${KULOFFICE_ENVIRONMENT:-production}
      KULOFFICE_SERVER_HTTP_PORT: "8080"
      KULOFFICE_SERVER_GRPC_PORT: "50051"
      KULOFFICE_SERVER_GRPC_MAX_RECV_MSG_SIZE: "20971520"
      KULOFFICE_SERVER_GRPC_MAX_SEND_MSG_SIZE: "20971520"
      KULOFFICE_DATABASE_URL: postgres://kuloffice:${KULOFFICE_DB_PASSWORD}@db:5432/kuloffice?sslmode=disable
      KULOFFICE_ADMIN_EMAIL: ${KULOFFICE_ADMIN_EMAIL:?set KULOFFICE_ADMIN_EMAIL}
      KULOFFICE_ADMIN_PASSWORD: ${KULOFFICE_ADMIN_PASSWORD:?set KULOFFICE_ADMIN_PASSWORD}
      # The admin API, for the PIN at the end of onboarding. Tokens are checked
      # against the public issuer, which kuloffice fetches through Apache.
      KULOFFICE_KEYCLOAK_BASE_URL: http://keycloak:8080
      KULOFFICE_KEYCLOAK_REALM: ${REALM:-kulpay}
      KULOFFICE_KEYCLOAK_CLIENT_ID: ${ADMIN_CLIENT_ID:-kulpay-backend}
      KULOFFICE_KEYCLOAK_CLIENT_SECRET: ${ADMIN_CLIENT_SECRET:?set ADMIN_CLIENT_SECRET}
      KULOFFICE_KEYCLOAK_ONBOARDING_ROLE: ${ONBOARDING_ROLE:-onboarding_pending}
      # Staff tokens from this realm never become customers; an operator added
      # in the portal is bound at first sign-in by their verified email.
      KULOFFICE_AUTH_WORKFORCE_ISSUERS: ${KEYCLOAK_PUBLIC_URL}/realms/${WORKFORCE_REALM:-workforce}
      KULOFFICE_SMS_BASE_URL: ${OLA_SMS_BASE_URL}
      KULOFFICE_SMS_API_KEY: ${OLA_SMS_API_KEY}
      KULOFFICE_SMS_PROVIDER_ID: ${OLA_SMS_PROVIDER_ID}
      KULOFFICE_FILESERVER_UPLOAD_URL: http://fileserver:8080/upload
      KULOFFICE_FILESERVER_DOWNLOAD_URL: http://fileserver:8080/files
      KULOFFICE_FILESERVER_KYC_BUCKET: ${KYC_BUCKET:-kyc}
      KULOFFICE_FILESERVER_PENDING_BUCKET: ${PENDING_BUCKET:-kyc-pending}
      # Submissions open review cases; approvals create the customer's identity
      # and wallet.
      KULOFFICE_OPERATOR_REVIEW_SYNC: "true"
      KULOFFICE_BIOMETRICS_ENABLED: ${BIOMETRICS_ENABLED:-true}
      # KulOffice owns the semantic topology. A fresh BLNK install is populated
      # and verified before any financial worker starts; provider IDs are never
      # copied into deployment configuration.
      KULOFFICE_ADAPTER_BLNK_BASE_URL: http://blnk-server:5001
      KULOFFICE_ADAPTER_BLNK_API_KEY: ${BLNK_SERVER_SECRET_KEY}
      KULOFFICE_ADAPTER_BLNK_ENVIRONMENT: ${KULOFFICE_ENVIRONMENT:-production}
      KULOFFICE_ADAPTER_BLNK_BOOTSTRAP_ENABLED: "true"
      # For now, selected financial capabilities run in the API container.
      # The durable instruction lease still prevents a second executor.
      KULOFFICE_EMBEDDED_FINANCIAL_WORKER: '{"enabled":true,"capabilities":["product_balance:query","product_transfer:create","fee:collect"],"max_capacity":1}'
      # Top-ups collect through the stack's own gateway. A wallet charge waits
      # for the customer (the simulator holds it up to 60s), so the client
      # timeout outlasts it; a timeout is an unknown outcome, re-sent with the
      # same reference.
      KULOFFICE_TOPUP_ENABLED: "true"
      KULOFFICE_TOPUP_GATEWAY: kulpay-gateway
      KULOFFICE_TOPUP_GATEWAY_URL: http://gateway:9090
      KULOFFICE_TOPUP_GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      KULOFFICE_TOPUP_GATEWAY_TIMEOUT: 120s
      KULOFFICE_TOPUP_MAX_CAPACITY: "2"
      # QR codes through Solange. Off until the key is set: `make solange-kulpay`
      # issues it (and the webhook secret) into .env.
      KULOFFICE_SOLANGE_BASE_URL: http://solange:8090
      KULOFFICE_SOLANGE_API_KEY: ${KULOFFICE_SOLANGE_API_KEY:-}
      KULOFFICE_SOLANGE_WEBHOOK_SECRETS: ${KULOFFICE_SOLANGE_WEBHOOK_SECRETS:-}
      KULOFFICE_SOLANGE_WEB_URL: ${WEB_PUBLIC_URL}
      KULOFFICE_SOLANGE_PUBLIC_API_URL: ${KULOFFICE_PUBLIC_URL}
      KULOFFICE_SOLANGE_LOGO_BUCKET: ${LOGO_BUCKET:-logos}
      KULOFFICE_SOLANGE_PERSONAL_PAYMENT_REQUESTS: ${PERSONAL_PAYMENT_REQUESTS:-false}
      # The public lookup believes forwarded addresses from Apache (the
      # gateway) and the web app (the stack's network) only.
      KULOFFICE_SOLANGE_TRUSTED_PROXIES: ${STACK_GATEWAY:-10.250.0.1},${STACK_SUBNET:-10.250.0.0/24}
    ports:
      - "127.0.0.1:${KULOFFICE_PORT:-9280}:8080"

  # ---- clients ----------------------------------------------------------------

  web:
    <<: *restart
    image: ${WEB_IMAGE:-developerspavs/kulpay-web}:${WEB_TAG:?set WEB_TAG}
    depends_on:
      kuloffice: { condition: service_started }
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      KULPAY_WEB_URL: ${WEB_PUBLIC_URL:?set WEB_PUBLIC_URL}
      KULPAY_KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${REALM:-kulpay}
      KULPAY_KEYCLOAK_CLIENT_ID: ${WEB_CLIENT_ID:-kulpay-web}
      KULPAY_KEYCLOAK_PASSKEY_CLIENT_ID: ${PASSKEY_CLIENT_ID:-kulpay-web-passkey}
      KULPAY_API_URL: http://kuloffice:8080
      KULPAY_SESSION_SECRET: ${KULPAY_SESSION_SECRET:?set KULPAY_SESSION_SECRET}
    ports:
      - "127.0.0.1:${WEB_PORT:-9380}:3000"

  # Signs numbers and staff in and keeps their tokens fresh. It holds live
  # tokens: Apache must put a password in front of it (apache/panel.conf).
  token-panel:
    <<: *restart
    image: ${TOKEN_PANEL_IMAGE:-developerspavs/kulpay-token-panel}:${TOKEN_PANEL_TAG:?set TOKEN_PANEL_TAG}
    depends_on:
      keycloak: { condition: service_healthy }
    environment:
      PANEL_PORT: "8765"
      PANEL_API_BASES: ${KULOFFICE_PUBLIC_URL:?set KULOFFICE_PUBLIC_URL}
    volumes:
      - token-panel-data:/panel
    ports:
      - "127.0.0.1:${PANEL_PORT:-9480}:8765"

  # ---- Solange (QR codes) -----------------------------------------------------

  # Applies Solange's migrations, then exits; `serve` starts after it.
  solange-migrate:
    image: ${SOLANGE_IMAGE:-developerspavs/kulpay-solange}:${SOLANGE_TAG:?set SOLANGE_TAG}
    networks: [kulpay]
    depends_on:
      db: { condition: service_healthy }
    command: ["migrate"]
    environment:
      SOLANGE_DATABASE_URL: &solange-db postgres://solange:${SOLANGE_DB_PASSWORD}@db:5432/solange?sslmode=disable

  solange:
    <<: *restart
    image: ${SOLANGE_IMAGE:-developerspavs/kulpay-solange}:${SOLANGE_TAG}
    depends_on:
      solange-migrate: { condition: service_completed_successfully }
    command: ["serve"]
    # Live webhooks must be https: Solange posts to kuloffice's public URL,
    # and this sends that hostname straight to the host's Apache.
    extra_hosts:
      - "${KULOFFICE_PUBLIC_HOST:-core.kulpay.pavulla.com}:${STACK_GATEWAY:-10.250.0.1}"
    environment:
      SOLANGE_DATABASE_URL: *solange-db
      SOLANGE_LISTEN: ":8090"
      # What printed codes point at: the scan edge.
      SOLANGE_PUBLIC_URL: ${SOLANGE_PUBLIC_URL:?set SOLANGE_PUBLIC_URL}
      SOLANGE_VISITOR_SECRET: ${SOLANGE_VISITOR_SECRET:?set SOLANGE_VISITOR_SECRET}
      SOLANGE_ENCRYPTION_KEY: ${SOLANGE_ENCRYPTION_KEY:?set SOLANGE_ENCRYPTION_KEY}
      SOLANGE_BEHIND_CLOUDFLARE: ${SOLANGE_BEHIND_CLOUDFLARE:-false}
      # Apache reaches the container through the network's gateway; only its
      # forwarded headers are believed.
      SOLANGE_TRUSTED_PROXIES: ${STACK_GATEWAY:-10.250.0.1}
      # Empty: places come from Cloudflare alone (see .env).
      SOLANGE_GEOIP_DB: ${SOLANGE_GEOIP_DB:-}
      SOLANGE_MAXMIND_ACCOUNT_ID: ${SOLANGE_MAXMIND_ACCOUNT_ID:-}
      SOLANGE_MAXMIND_LICENSE_KEY: ${SOLANGE_MAXMIND_LICENSE_KEY:-}
      # Staff sign in through the workforce realm; the console's client roles
      # (viewer, developer, admin) decide what they may do.
      SOLANGE_KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${WORKFORCE_REALM:-workforce}
      SOLANGE_KEYCLOAK_CLIENT: ${SOLANGE_CONSOLE_CLIENT_ID:-solange-console}
    volumes:
      - ${SOLANGE_GEOIP_DIR:-./geoip}:/geoip
    ports:
      - "127.0.0.1:${SOLANGE_PORT:-9580}:8090"

  solange-console:
    <<: *restart
    image: ${SOLANGE_CONSOLE_IMAGE:-developerspavs/kulpay-solange-console}:${SOLANGE_CONSOLE_TAG:?set SOLANGE_CONSOLE_TAG}
    depends_on:
      solange: { condition: service_started }
    environment:
      SOLANGE_CONSOLE_URL: ${SOLANGE_CONSOLE_PUBLIC_URL:?set SOLANGE_CONSOLE_PUBLIC_URL}
      SOLANGE_KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${WORKFORCE_REALM:-workforce}
      SOLANGE_KEYCLOAK_CLIENT_ID: ${SOLANGE_CONSOLE_CLIENT_ID:-solange-console}
      SOLANGE_API_URL: http://solange:8090
      SOLANGE_PUBLIC_URL: ${SOLANGE_PUBLIC_URL}
      SOLANGE_SESSION_SECRET: ${SOLANGE_SESSION_SECRET:?set SOLANGE_SESSION_SECRET}
    ports:
      - "127.0.0.1:${SOLANGE_CONSOLE_PORT:-9680}:3200"

  # ---- kulportal (not ready yet) ------------------------------------------------

  # Off by default: `make start-portal` once KULPORTAL_TAG is set.
  kulportal:
    <<: *restart
    profiles: ["portal"]
    image: ${KULPORTAL_IMAGE:-developerspavs/kulpay-kulportal}:${KULPORTAL_TAG:-unset}
    env_file:
      - path: kulportal.env
        required: false
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # kulportal2: reviewers sign in to the workforce realm (its client is made
      # by init, whose secret bin/kulpay generates into .env on first deploy).
      KULOFFICE_URL: http://kuloffice:8080
      OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${WORKFORCE_REALM:-workforce}
      OIDC_CLIENT_ID: kulportal
      OIDC_CLIENT_SECRET: ${KULPORTAL_CLIENT_SECRET:-}
      PORTAL_URL: ${KULPORTAL_PUBLIC_URL:-https://portal.kulpay.pavulla.com}
      SESSION_SECRET: ${KULPORTAL_SESSION_SECRET:-}
    ports:
      - "127.0.0.1:${KULPORTAL_PORT:-9780}:3000"

  # ---- provisioning -------------------------------------------------------------

  # The realms, their clients, kuloffice's license and identity providers, and
  # staff accounts. Never runs on its own: `make init`, `make operator`.
  tools:
    image: ${TOOLS_IMAGE:-developerspavs/kulpay-tools}:${TOOLS_TAG:?set TOOLS_TAG}
    profiles: ["tools"]
    networks: [kulpay]
    # The same settings as the stack (the Makefile's ENV_FILE).
    env_file: ["${ENV_FILE:-.env}"]
    # This checkout's scripts over the image's copies, so a provisioning change
    # applies with a git pull (the image only changes with intaka's tags).
    volumes:
      - ./tools:/tools:ro
      - ../stack:/stack:ro
    environment:
      # From the stack's network the master realm's admin login is allowed:
      # Keycloak treats private addresses as local (sslRequired=external).
      KEYCLOAK_URL: http://keycloak:8080
      KULOFFICE_URL: http://kuloffice:8080
