# Looks at the KulPay server: each unit's tag, the release history (the tags a
# rollback can go to), or a health check of the running units.
name: Server

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [releases, status, health]
      unit:
        description: Only this unit (releases and health)
        type: choice
        options: [all, kuloffice, web, keycloak, solange, fileserver, kulportal]
        default: all

permissions:
  contents: read

jobs:
  server:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kulpay-server
        with:
          command: ${{ inputs.action }} ${{ inputs.action != 'status' && inputs.unit != 'all' && inputs.unit || '' }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          user: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
