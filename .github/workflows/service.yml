# Builds a unit's images at a repository's tag, pushes them to Docker Hub and
# deploys them on the KulPay server (bin/kulpay: health-checked, back to the
# previous tag on failure, which turns this run red). Called by each service
# repository's release workflow, on its tags only:
#
#   jobs:
#     release:
#       uses: pavulla-tech/kuloffice-demo/.github/workflows/service.yml@main
#       with: { unit: web }
#       secrets: inherit
#
# Secrets (organisation-level; see CICD.md): KULPAY_DOCKERHUB_USERNAME,
# KULPAY_DOCKERHUB_TOKEN, DEPLOY_HOST, DEPLOY_USER, DEPLOY_PASSWORD,
# DEPLOY_KNOWN_HOSTS (optional, recommended), DEPLOY_PORT if SSH isn't on 22,
# KULPAY_DOCKERHUB_PULL_TOKEN (optional: the server's pulls for this run).
# The Docker Hub ones have their own names: kuloffice keeps repository-level
# DOCKERHUB_* for another account, and those would win over the org's.
name: KulPay service

on:
  workflow_call:
    inputs:
      unit:
        description: keycloak, kuloffice, web, fileserver, solange or kulportal
        type: string
        required: true
      kit-ref:
        description: The kuloffice-demo ref whose recipes build the images
        type: string
        default: main
      deploy:
        description: false builds and pushes only
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.unit }} ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::KulPay releases run on tags only"; exit 1; }
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' ||
            { echo "::error::$GITHUB_REF_NAME is not a tag like v0.1.0-alpha01"; exit 1; }
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          repository: pavulla-tech/kuloffice-demo
          ref: ${{ inputs.kit-ref }}
          path: kit
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.KULPAY_DOCKERHUB_USERNAME }}
          password: ${{ secrets.KULPAY_DOCKERHUB_TOKEN }}
      - name: Build and push
        run: kit/deploy/ci/build.sh "${{ inputs.unit }}" "$GITHUB_REF_NAME" src --push

  deploy:
    name: Deploy ${{ inputs.unit }} ${{ github.ref_name }}
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    # The server also queues deploys coming from other repositories.
    concurrency:
      group: kulpay-server
      cancel-in-progress: false
    steps:
      - uses: pavulla-tech/kuloffice-demo/.github/actions/kulpay-server@main
        with:
          command: deploy ${{ inputs.unit }} ${{ github.ref_name }} --actor ${{ github.actor }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          user: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          registry-user: ${{ secrets.KULPAY_DOCKERHUB_USERNAME }}
          registry-token: ${{ secrets.KULPAY_DOCKERHUB_PULL_TOKEN }}
