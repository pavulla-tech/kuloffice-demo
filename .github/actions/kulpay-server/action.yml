name: KulPay server
description: >
  Runs a bin/kulpay command on the KulPay server as the deploy user (password
  login, forced to bin/kulpay-ssh: deploy, rollback, releases, status, health).
inputs:
  command:
    description: The command, e.g. "deploy web v0.1.0-alpha02 --actor octocat"
    required: true
  host:
    required: true
  port:
    default: "22"
  user:
    required: true
  password:
    required: true
  registry-user:
    description: Docker Hub user for this run's pulls (with registry-token)
    default: ""
  registry-token:
    description: >
      A Docker Hub token the server pulls with for this run only (sent on
      stdin, logged in to a throwaway config, deleted when the run ends).
      Empty: the server pulls anonymously.
    default: ""
  known-hosts:
    description: >
      The server's public host key (DEPLOY_KNOWN_HOSTS): "ssh-ed25519 AAAA…",
      or a whole known_hosts line. Without it the host key is not checked.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SSHPASS: ${{ inputs.password }}
        HOST: ${{ inputs.host }}
        PORT: ${{ inputs.port }}
        LOGIN: ${{ inputs.user }}
        KNOWN: ${{ inputs.known-hosts }}
        COMMAND: ${{ inputs.command }}
        REGISTRY_USER: ${{ inputs.registry-user }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
      run: |
        command -v sshpass > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null; }
        opts=(-T -p "$PORT" -o PubkeyAuthentication=no -o PreferredAuthentications=password
              -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
        if [ -n "$KNOWN" ]; then
          # Just the key ("ssh-ed25519 AAAA…") is enough: the host goes in front
          # here, in the form ssh looks up ([host]:port off port 22).
          name=$HOST; [ "$PORT" = 22 ] || name="[$HOST]:$PORT"
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN" | while read -r first rest; do
            [ -n "$first" ] || continue
            case $first in
              ssh-* | ecdsa-* | sk-*) printf '%s %s %s\n' "$name" "$first" "$rest" ;;
              *) printf '%s %s\n' "$first" "$rest" ;;
            esac
          done >> ~/.ssh/known_hosts
          opts+=(-o StrictHostKeyChecking=yes)
        else
          echo "::warning::DEPLOY_KNOWN_HOSTS is not set, so the server's identity is not checked"
          opts+=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
        fi
        # The pull credentials go on stdin, never on the command line (which
        # the server logs and shows in its process list).
        if [ -n "$REGISTRY_TOKEN" ]; then
          printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" | sshpass -e ssh "${opts[@]}" "$LOGIN@$HOST" "$COMMAND"
        else
          sshpass -e ssh "${opts[@]}" "$LOGIN@$HOST" "$COMMAND" < /dev/null
        fi
