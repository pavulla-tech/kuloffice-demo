# pavulla-tech's self-hosted GitHub Actions runners, on the dev server
# (README.md). Two build runners (tests, image builds) and one small deploy
# runner, registered once to the organisation. Jobs on them use no GitHub
# minutes. Each build runner has its own Docker engine (a dind sidecar), so a
# job never sees or prunes the stack's containers and images.
#
# The registration token is only in .env (RUNNER_TOKEN, valid one hour): the
# runners keep their registration in their volume after the first start.
#
# Light on the server (2026-11-09: about 11 GB free, no swap): every runner and
# Docker engine has a low CPU weight (cpu_shares 256 against the default 1024),
# so the dev stack and the server's other services win when the CPU is
# contended; an idle server still gives the builds their CPUs. The Docker
# engines are capped at 4 GB (Go image builds peak there). Short jobs (meta,
# publishing a release, submitting it) go to the small «light» runner instead
# of holding a build runner.

x-runner: &runner
  image: ${RUNNER_IMAGE:-myoung34/github-runner:latest}
  restart: unless-stopped
  environment: &runner-env
    RUNNER_SCOPE: org
    ORG_NAME: ${ORG_NAME:-pavulla-tech}
    RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    RUNNER_GROUP: ${RUNNER_GROUP:-Default}
    # The registration and the runner's files survive restarts here.
    CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner/data
    # Keep the registration when a container stops: deregistering needs a
    # token at every start, and the one-hour registration token is gone after
    # the first (without this the runners restart in a loop).
    DISABLE_AUTOMATIC_DEREGISTRATION: "true"
    RUNNER_WORKDIR: /runner/work
    DISABLE_AUTO_UPDATE: "false"
  networks: [runners]
  cpu_shares: 256

x-dind: &dind
  image: ${DIND_IMAGE:-docker:27-dind}
  restart: unless-stopped
  privileged: true
  environment:
    DOCKER_TLS_CERTDIR: /certs
  networks: [runners]
  cpu_shares: 256

services:
  build-1:
    <<: *runner
    environment:
      <<: *runner-env
      RUNNER_NAME: pavulla-build-1
      LABELS: self-hosted,linux,x64,pavulla,build
      DOCKER_HOST: tcp://dind-1:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      # Go's module and build caches stay between jobs (no GitHub cache).
      GOMODCACHE: /runner/cache/go/mod
      GOCACHE: /runner/cache/go/build
      npm_config_cache: /runner/cache/npm
    volumes:
      - build-1-data:/runner/data
      - build-1-work:/runner/work
      - build-1-cache:/runner/cache
      - build-1-tools:/opt/hostedtoolcache
      - dind-1-certs:/certs/client:ro
    depends_on: [dind-1]
    cpus: 3
    mem_limit: 6g

  dind-1:
    <<: *dind
    # Its TLS certificate names this host, the one build-1 connects to.
    hostname: dind-1
    volumes:
      - dind-1-certs:/certs/client
      - dind-1-docker:/var/lib/docker
    cpus: 3
    mem_limit: 4g

  build-2:
    <<: *runner
    environment:
      <<: *runner-env
      RUNNER_NAME: pavulla-build-2
      LABELS: self-hosted,linux,x64,pavulla,build
      DOCKER_HOST: tcp://dind-2:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      GOMODCACHE: /runner/cache/go/mod
      GOCACHE: /runner/cache/go/build
      npm_config_cache: /runner/cache/npm
    volumes:
      - build-2-data:/runner/data
      - build-2-work:/runner/work
      - build-2-cache:/runner/cache
      - build-2-tools:/opt/hostedtoolcache
      - dind-2-certs:/certs/client:ro
    depends_on: [dind-2]
    cpus: 3
    mem_limit: 6g

  dind-2:
    <<: *dind
    # Its TLS certificate names this host, the one build-2 connects to.
    hostname: dind-2
    volumes:
      - dind-2-certs:/certs/client
      - dind-2-docker:/var/lib/docker
    cpus: 3
    mem_limit: 4g

  # Short jobs: a release's meta step, publishing it on GitHub, submitting it
  # to KulOffice. No Docker engine; tools come from apt or setup-* actions.
  light:
    <<: *runner
    environment:
      <<: *runner-env
      RUNNER_NAME: pavulla-light
      LABELS: self-hosted,linux,x64,pavulla,light
    volumes:
      - light-data:/runner/data
      - light-work:/runner/work
      - light-tools:/opt/hostedtoolcache
    cpus: 1
    mem_limit: 1536m

  # Deploys only: an SSH command and a wait on the health check. No Docker.
  deploy:
    <<: *runner
    environment:
      <<: *runner-env
      RUNNER_NAME: pavulla-deploy
      LABELS: self-hosted,linux,x64,pavulla,deploy
    volumes:
      - deploy-data:/runner/data
      - deploy-work:/runner/work
    cpus: 0.5
    mem_limit: 512m

networks:
  runners:

volumes:
  build-1-data: {}
  build-1-work: {}
  build-1-cache: {}
  build-1-tools: {}
  dind-1-certs: {}
  dind-1-docker: {}
  build-2-data: {}
  build-2-work: {}
  build-2-cache: {}
  build-2-tools: {}
  dind-2-certs: {}
  dind-2-docker: {}
  deploy-data: {}
  deploy-work: {}
  light-data: {}
  light-work: {}
  light-tools: {}
