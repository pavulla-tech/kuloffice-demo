# The whole kuloffice test stack in one file: Keycloak (intaka) and its realm,
# kuloffice, the web app, the token panel, MinIO behind the boquisso file
# server, Postgres, and the dev SMS inbox. Only MiniAiLive and BLNK stay on
# their hosted instances.
#
#   make up      build, start, configure (license, IdP, realm, buckets)
#
# Run it through the Makefile: it generates the license keys, passes
# stack.env, and leaves the untracked docker-compose.override.yml out (that
# file belongs to the older two-project setup and would rewire kuloffice).
#
# One localhost. A token's issuer is http://localhost:${KC_PORT}/auth/realms/demo
# and kuloffice and the web app both fetch it server side. Every service that
# needs that URL shares the `net` container's network namespace, so localhost
# is the same place for them as for the browser, and the ports published on
# `net` are the ones they listen on. That is why host and container ports are
# always equal here, and why a port is changed in stack.env and nowhere else.
#
# Sources are sibling checkouts (see stack.env.example). Builds copy only what
# they need, so node_modules and .git never enter a build context.

x-kuloffice-build: &kuloffice-build
  context: ${KULOFFICE_DIR:-../kuloffice}
  args:
    # Generated by `make keys`; the matching private key signs the license.
    LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
    LICENSE_ISSUER: ${LICENSE_ISSUER:-pavulla.com}
  dockerfile_inline: |
    # syntax=docker/dockerfile:1
    FROM golang:1.25-alpine AS build
    WORKDIR /src
    # No `go mod download`: it fetches test-only modules too. The build fetches
    # what the binaries import, into the cache mount.
    COPY go.mod go.sum ./
    COPY cmd ./cmd
    COPY internal ./internal
    COPY pkg ./pkg
    COPY proto ./proto
    ARG LICENSE_PUBLIC_KEY
    ARG LICENSE_ISSUER
    RUN --mount=type=cache,target=/go/pkg/mod --mount=type=cache,target=/root/.cache/go-build \
        test -n "$$LICENSE_PUBLIC_KEY" || { echo "LICENSE_PUBLIC_KEY is empty: run make keys" >&2; exit 1; }; \
        CGO_ENABLED=0 go build -tags 'metrics tracing cache' -ldflags "\
          -X github.com/pavulla-tech/kuloffice/internal/commands.binaryName=kuloffice \
          -X github.com/pavulla-tech/kuloffice/internal/license.publicKey=$$LICENSE_PUBLIC_KEY \
          -X github.com/pavulla-tech/kuloffice/internal/license.issuer=$$LICENSE_ISSUER" \
          -o /out/kuloffice ./cmd/kuloffice && \
        CGO_ENABLED=0 go build -o /out/kuloffice-license ./cmd/kuloffice-license
    FROM alpine:3.19
    RUN apk add --no-cache ca-certificates tzdata curl && adduser -D -u 1000 kuloffice
    COPY --from=build /out/ /usr/local/bin/
    USER kuloffice
    WORKDIR /home/kuloffice
    ENTRYPOINT ["kuloffice"]
    CMD ["serve"]

services:
  # Owns the shared network namespace and publishes its ports. It does nothing
  # else, so restarting any real service never takes the others' network away.
  net:
    image: alpine:3.19
    command: ["sleep", "infinity"]
    init: true
    restart: unless-stopped
    ports:
      - "${STACK_BIND:-127.0.0.1}:${KC_PORT:-8080}:${KC_PORT:-8080}"
      - "${STACK_BIND:-127.0.0.1}:${KULOFFICE_PORT:-18080}:${KULOFFICE_PORT:-18080}"
      - "${STACK_BIND:-127.0.0.1}:${KULOFFICE_GRPC_PORT:-50051}:${KULOFFICE_GRPC_PORT:-50051}"
      - "${STACK_BIND:-127.0.0.1}:${WEB_PORT:-3000}:${WEB_PORT:-3000}"
      - "${STACK_BIND:-127.0.0.1}:${PORTAL_PORT:-3100}:${PORTAL_PORT:-3100}"
      - "${STACK_BIND:-127.0.0.1}:${SOLANGE_PORT:-8094}:${SOLANGE_PORT:-8094}"
      - "${STACK_BIND:-127.0.0.1}:${SOLANGE_CONSOLE_PORT:-8095}:${SOLANGE_CONSOLE_PORT:-8095}"
      # The panel holds live tokens: loopback only, whatever STACK_BIND says.
      - "127.0.0.1:${PANEL_PORT:-8765}:${PANEL_PORT:-8765}"

  db:
    profiles: ["base"]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuloffice
      POSTGRES_PASSWORD: kuloffice
      POSTGRES_DB: kuloffice
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates Keycloak's database next to kuloffice's, on first start only.
      - ./stack/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "${STACK_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuloffice -d kuloffice"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- identity -------------------------------------------------------------

  keycloak:
    profiles: ["keycloak"]
    build:
      context: ${INTAKA_DIR:-../keycloak-phone-authenticator}
    # The local build, or a tag from Docker Hub (stack/resolve.sh).
    image: ${KEYCLOAK_REF:-kulstack-keycloak:local}
    network_mode: service:net
    restart: unless-stopped
    depends_on:
      net: { condition: service_started }
      db: { condition: service_healthy }
    command:
      - start-dev
      - --http-port=${KC_PORT:-8080}
      - --http-relative-path=/auth
      # Codes go to the dev inbox through the real HTTP sender, the same code
      # path production uses.
      - --spi-phone-auth-sms-sender--provider=http
      - --spi-phone-auth-sms-sender--http--base-url=http://sms-inbox:8080/api/dev/sms
      - --spi-phone-auth-sms-sender--http--api-key=demo-sms-key
      - --spi-phone-auth-sms-sender--http--provider-id=demo
      - --spi-phone-auth-app-origins=${PASSKEY_APP_ORIGINS:-}
      - --log-level=INFO,com.pavulla.keycloak.phoneauth:debug
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:${KC_PORT:-8080}/auth
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Postgres rather than start-dev's in-memory store: the realm and its
      # users survive a recreate, and stay in step with kuloffice's accounts.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    # The kulpay login theme comes from the extension JAR. Do not mount
    # demo/theme over it: that copy is older and lacks the OTP script.
    healthcheck:
      # No curl in the image; bash can speak HTTP to the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # The demo realm: clients for the app, mobile, web, passkey and token panel,
  # the phone flows, and the demo-backend admin client kuloffice uses. Every
  # script is idempotent, so this runs on every `up`. On the loopback because
  # the master realm refuses plain-HTTP admin logins from anywhere else.
  realm-setup:
    profiles: ["keycloak"]
    image: python:3.12-alpine
    network_mode: service:net
    depends_on:
      keycloak: { condition: service_healthy }
    volumes:
      - ${INTAKA_DIR:-../keycloak-phone-authenticator}/demo/setup:/setup:ro
      - ./stack:/stack:ro
      - ./deploy/tools:/deploy-tools:ro
    environment:
      KEYCLOAK_URL: http://localhost:${KC_PORT:-8080}/auth
      REALM: demo
      # Solange's console client and roles (the server's deploy/tools scripts).
      SOLANGE_CONSOLE_PUBLIC_URL: http://localhost:${SOLANGE_CONSOLE_PORT:-8095}
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The review portal's client (stack/add_portal_client.py).
      PORTAL_URL: http://localhost:${PORTAL_PORT:-3100}
      PORTAL_CLIENT_SECRET: ${PORTAL_CLIENT_SECRET:-kulportal-local-secret}
      APP_CLIENT_ID: demo-app
      ADMIN_CLIENT_ID: demo-backend
      ADMIN_CLIENT_SECRET: demo-backend-secret
      # The demo page's origin (intaka's backend, the sms-inbox service): the
      # demo-app client's redirect and web origin. Keycloak's own is below.
      PUBLIC_BASE_URL: http://localhost:${SMS_INBOX_PORT:-8090}
      KEYCLOAK_PUBLIC_URL: http://localhost:${KC_PORT:-8080}/auth
      WEB_BASE_URL: http://localhost:${WEB_PORT:-3000}
      PANEL_ORIGIN: http://localhost:${PANEL_PORT:-8765}
      # The staff realm and its demo reviewer (add_workforce_realm.py).
      REVIEWER_EMAIL: ${REVIEWER_EMAIL:-reviewer@kulpay.local}
      REVIEWER_PASSWORD: ${REVIEWER_PASSWORD:-reviewer}
      API_CLIENT_SECRET: ${WORKFORCE_API_SECRET:-kuloffice-workforce-secret}
      DEBUG: "false"
    # update_existing_realm.py exists on intaka's newer branches only; it
    # brings a realm made by an older configure_realm.py up to date.
    command:
      - sh
      - -ec
      - |
        python3 /setup/configure_realm.py
        python3 /setup/add_token_panel_client.py
        # The USSD channel, for a realm made before configure_realm.py added it.
        if [ -f /setup/add_ussd_client.py ]; then python3 /setup/add_ussd_client.py; fi
        if [ -f /setup/update_existing_realm.py ]; then python3 /setup/update_existing_realm.py; fi
        if [ -f /setup/add_workforce_realm.py ]; then python3 /setup/add_workforce_realm.py; else echo "no workforce realm script in this intaka checkout: reviewer sign-in skipped"; fi
        python3 /stack/add_portal_client.py
        python3 /deploy-tools/solange_console_client.py
        STAFF_EMAIL="$$REVIEWER_EMAIL" SOLANGE_ROLES=admin python3 /deploy-tools/staff_user.py

  # The demo backend from intaka. It is the dev SMS inbox - Keycloak sends codes
  # to it and kuloffice sends its SMS to it, so nothing reaches a real phone;
  # read it at http://localhost:${SMS_INBOX_PORT}/api/dev/inbox - and the demo
  # page and API the intaka demo app and its Flutter client talk to.
  sms-inbox:
    profiles: ["inbox"]
    build:
      context: ${INTAKA_DIR:-../keycloak-phone-authenticator}/demo
      dockerfile: backend/Dockerfile
    image: ${STACK_NAME:-kulstack}-sms-inbox:local
    restart: unless-stopped
    environment:
      KEYCLOAK_INTERNAL_URL: http://net:${KC_PORT:-8080}/auth
      PUBLIC_BASE_URL: http://localhost:${SMS_INBOX_PORT:-8090}
      KEYCLOAK_PUBLIC_URL: http://localhost:${KC_PORT:-8080}/auth
      REALM: demo
      APP_CLIENT_ID: demo-app
      ADMIN_CLIENT_ID: demo-backend
      ADMIN_CLIENT_SECRET: demo-backend-secret
      SMS_API_KEY: demo-sms-key
      DEV_INBOX_ENABLED: "true"
      DEBUG: "false"
    ports:
      - "${STACK_BIND:-127.0.0.1}:${SMS_INBOX_PORT:-8090}:8080"

  # ---- files ------------------------------------------------------------------

  minio:
    profiles: ["kuloffice"]
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kulstack}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kulstack-local}
    volumes:
      - minio-data:/data
    ports:
      - "${STACK_BIND:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${STACK_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The two buckets kuloffice uses. Images wait in the pending bucket until a
  # submission is accepted, and its lifecycle rule removes what never is.
  minio-init:
    profiles: ["kuloffice"]
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kulstack}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kulstack-local}
      KYC_BUCKET: ${KYC_BUCKET:-test}
      PENDING_BUCKET: ${PENDING_BUCKET:-kyc-pending}
      PENDING_EXPIRY_DAYS: ${PENDING_EXPIRY_DAYS:-1}
    entrypoint:
      - sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$KYC_BUCKET" "local/$$PENDING_BUCKET" local/logos
        if mc ilm rule ls "local/$$PENDING_BUCKET" >/dev/null 2>&1; then
          echo "lifecycle rule on $$PENDING_BUCKET already set"
        else
          mc ilm rule add --expire-days "$$PENDING_EXPIRY_DAYS" "local/$$PENDING_BUCKET"
        fi

  # boquisso-fileserver: the HTTP API kuloffice talks to, in front of MinIO.
  fileserver:
    profiles: ["kuloffice"]
    build:
      context: ${FILESERVER_DIR:-../boquisso-fileserver}
      dockerfile_inline: |
        # syntax=docker/dockerfile:1
        FROM golang:1.25-alpine AS build
        WORKDIR /src
        COPY go.mod go.sum ./
        COPY main.go ./
        COPY dnf ./dnf
        RUN --mount=type=cache,target=/go/pkg/mod --mount=type=cache,target=/root/.cache/go-build \
            CGO_ENABLED=0 go build -o /out/boquisso .
        FROM alpine:3.19
        RUN apk add --no-cache ca-certificates tzdata && adduser -D -u 1000 boquisso
        COPY --from=build /out/boquisso /usr/local/bin/boquisso
        USER boquisso
        ENTRYPOINT ["boquisso"]
    image: ${FILESERVER_REF:-kulstack-fileserver:local}
    restart: unless-stopped
    depends_on:
      minio-init: { condition: service_completed_successfully }
    environment:
      API_PORT: "8080"
      ENDPOINT: minio:9000
      ACCESS_KEY_ID: ${MINIO_ROOT_USER:-kulstack}
      SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-kulstack-local}
      USE_SSL: "false"
    ports:
      - "${STACK_BIND:-127.0.0.1}:${FILESERVER_PORT:-8082}:8080"

  # ---- kuloffice --------------------------------------------------------------

  kuloffice:
    profiles: ["kuloffice"]
    build: *kuloffice-build
    image: ${KULOFFICE_REF:-kulstack-kuloffice:local}
    network_mode: service:net
    restart: unless-stopped
    # Anything else kuloffice reads (KULOFFICE_*), e.g. MiniAiLive's endpoints.
    # Optional and gitignored; see stack.kuloffice.env.example. `environment`
    # below wins over it. Apply a change with `make kuloffice`.
    env_file:
      - path: stack.kuloffice.env
        required: false
    depends_on:
      net: { condition: service_started }
      db: { condition: service_healthy }
      fileserver: { condition: service_started }
      sms-inbox: { condition: service_started, required: false }
    environment:
      KULOFFICE_ENVIRONMENT: development
      KULOFFICE_SERVER_HTTP_PORT: ${KULOFFICE_PORT:-18080}
      KULOFFICE_SERVER_GRPC_PORT: ${KULOFFICE_GRPC_PORT:-50051}
      KULOFFICE_SERVER_GRPC_MAX_RECV_MSG_SIZE: "20971520"
      KULOFFICE_SERVER_GRPC_MAX_SEND_MSG_SIZE: "20971520"
      KULOFFICE_DATABASE_URL: postgres://kuloffice:kuloffice@db:5432/kuloffice?sslmode=disable
      KULOFFICE_ADMIN_EMAIL: ${KULOFFICE_ADMIN_EMAIL:-admin@kulpay.local}
      KULOFFICE_ADMIN_PASSWORD: ${KULOFFICE_ADMIN_PASSWORD:-localadmin}
      # Sets the PIN at the end of onboarding (POST /onboarding/pin).
      # The local demo realm, or the server's (KEYCLOAK=server).
      KULOFFICE_KEYCLOAK_BASE_URL: ${KC_PUBLIC:-http://localhost:8080/auth}
      KULOFFICE_KEYCLOAK_REALM: ${KC_REALM:-demo}
      KULOFFICE_KEYCLOAK_CLIENT_ID: ${KC_BACKEND_CLIENT:-demo-backend}
      KULOFFICE_KEYCLOAK_CLIENT_SECRET: ${KC_BACKEND_SECRET:-demo-backend-secret}
      KULOFFICE_KEYCLOAK_ONBOARDING_ROLE: onboarding_pending
      # The dev inbox, never the real gateway (whose credentials are the
      # config defaults).
      KULOFFICE_SMS_BASE_URL: http://sms-inbox:8080/api/dev/sms
      KULOFFICE_SMS_API_KEY: demo-sms-key
      KULOFFICE_SMS_PROVIDER_ID: demo
      KULOFFICE_FILESERVER_UPLOAD_URL: http://fileserver:8080/upload
      KULOFFICE_FILESERVER_DOWNLOAD_URL: http://fileserver:8080/files
      KULOFFICE_FILESERVER_KYC_BUCKET: ${KYC_BUCKET:-test}
      KULOFFICE_FILESERVER_PENDING_BUCKET: ${PENDING_BUCKET:-kyc-pending}
      # KYC submissions open review cases, and approvals create the customer's
      # identity and wallet (on the hosted BLNK).
      KULOFFICE_OPERATOR_REVIEW_SYNC: "true"
      # false: no MiniAiLive calls at all; a reviewer transcribes instead.
      KULOFFICE_BIOMETRICS_ENABLED: ${BIOMETRICS_ENABLED:-true}
      # QR codes: the local Solange (stack/solange-setup.sh issues the key and
      # the webhook), or the server's with SOLANGE_API_KEY. Off when neither.
      KULOFFICE_SOLANGE_BASE_URL: ${SOLANGE_BASE:-}
      KULOFFICE_SOLANGE_API_KEY: ${SOLANGE_KEY:-}
      KULOFFICE_SOLANGE_WEBHOOK_SECRETS: ${SOLANGE_WEBHOOK_SECRETS:-}
      KULOFFICE_SOLANGE_WEB_URL: ${WEB_URL:-http://localhost:3000}
      KULOFFICE_SOLANGE_PUBLIC_API_URL: http://localhost:${KULOFFICE_PORT:-18080}

  # ---- Solange (QR codes), the same image as the server's ---------------------
  # Its database beside kuloffice's, made once (the init script only runs on a
  # new volume).
  solange-db:
    profiles: ["qr"]
    image: postgres:17
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: kuloffice
    entrypoint:
      - sh
      - -ec
      - |
        q() { psql -h db -U kuloffice -d postgres -tAc "$$1"; }
        [ "$$(q "SELECT 1 FROM pg_roles WHERE rolname='solange'")" = 1 ] || q "CREATE USER solange WITH PASSWORD 'solange'"
        [ "$$(q "SELECT 1 FROM pg_database WHERE datname='solange'")" = 1 ] || q "CREATE DATABASE solange OWNER solange"
        echo "solange database ready"

  solange-migrate:
    profiles: ["qr"]
    image: ${SOLANGE_IMAGE:-developerspavs/kulpay-solange}:${SOLANGE_TAG:-2026.10.03-1}
    platform: linux/amd64 # the only image built; runs emulated on Apple silicon
    depends_on:
      solange-db: { condition: service_completed_successfully }
    command: ["migrate"]
    environment:
      SOLANGE_DATABASE_URL: postgres://solange:solange@db:5432/solange?sslmode=disable

  # http://localhost:${SOLANGE_PORT}: the API kuloffice calls, and the scan
  # edge printed codes point at. Test mode: its webhooks may be plain http.
  solange:
    profiles: ["qr"]
    image: ${SOLANGE_IMAGE:-developerspavs/kulpay-solange}:${SOLANGE_TAG:-2026.10.03-1}
    platform: linux/amd64 # the only image built; runs emulated on Apple silicon
    network_mode: service:net
    restart: unless-stopped
    depends_on:
      solange-migrate: { condition: service_completed_successfully }
    command: ["serve"]
    environment:
      SOLANGE_DATABASE_URL: postgres://solange:solange@db:5432/solange?sslmode=disable
      SOLANGE_LISTEN: ":${SOLANGE_PORT:-8094}"
      SOLANGE_PUBLIC_URL: http://localhost:${SOLANGE_PORT:-8094}
      SOLANGE_VISITOR_SECRET: kuloffice-demo-local-visitor-secret
      # Seals webhook secrets: local only, never the server's.
      SOLANGE_ENCRYPTION_KEY: a3Vsb2ZmaWNlLWRlbW8tbG9jYWwtc29sYW5nZS1rZXk=
      SOLANGE_TRUSTED_PROXIES: 127.0.0.1
      # The staff API, for the console: the local workforce realm.
      SOLANGE_KEYCLOAK_ISSUER: http://localhost:${KC_PORT:-8080}/auth/realms/workforce
      SOLANGE_KEYCLOAK_CLIENT: solange-console

  # Solange's console: codes, templates, logos, keys, webhooks.
  # http://localhost:${SOLANGE_CONSOLE_PORT}, as the demo reviewer (admin there).
  solange-console:
    profiles: ["qr"]
    image: ${SOLANGE_CONSOLE_IMAGE:-developerspavs/kulpay-solange-console}:${SOLANGE_CONSOLE_TAG:-2026.10.02-1}
    platform: linux/amd64
    network_mode: service:net
    restart: unless-stopped
    depends_on:
      solange: { condition: service_started }
    command: ["node_modules/.bin/next", "start", "--port", "${SOLANGE_CONSOLE_PORT:-8095}"]
    environment:
      SOLANGE_CONSOLE_URL: http://localhost:${SOLANGE_CONSOLE_PORT:-8095}
      SOLANGE_KEYCLOAK_ISSUER: http://localhost:${KC_PORT:-8080}/auth/realms/workforce
      SOLANGE_KEYCLOAK_CLIENT_ID: solange-console
      SOLANGE_API_URL: http://localhost:${SOLANGE_PORT:-8094}
      SOLANGE_PUBLIC_URL: http://localhost:${SOLANGE_PORT:-8094}
      SOLANGE_SESSION_SECRET: kuloffice-demo-local-solange-console-session-0123456789

  # Activates the license and registers Keycloak as kuloffice's identity
  # provider, skipping whichever is already done. Re-run with `make bootstrap`.
  bootstrap:
    # kuloffice's image, which has kuloffice-license and curl. Built by the
    # kuloffice service; a second build block here would build it twice.
    # The local kuloffice build, or plain curl when kuloffice comes from Docker
    # Hub (its license is then the server's, KULOFFICE_LICENSE_KEY).
    image: ${BOOTSTRAP_REF:-kulstack-kuloffice:local}
    profiles: ["kuloffice"]
    network_mode: service:net
    user: root
    depends_on:
      kuloffice: { condition: service_started }
      realm-setup: { condition: service_completed_successfully, required: false }
    entrypoint: ["sh", "/stack/bootstrap.sh"]
    volumes:
      - ./stack/bootstrap.sh:/stack/bootstrap.sh:ro
      - ./.stack/keys:/keys:ro
    environment:
      KULOFFICE_URL: http://localhost:${KULOFFICE_PORT:-18080}
      KULOFFICE_ADMIN_EMAIL: ${KULOFFICE_ADMIN_EMAIL:-admin@kulpay.local}
      KULOFFICE_ADMIN_PASSWORD: ${KULOFFICE_ADMIN_PASSWORD:-localadmin}
      LICENSE_ISSUER: ${LICENSE_ISSUER:-pavulla.com}
      KULOFFICE_LICENSE_KEY: ${KULOFFICE_LICENSE_KEY:-}
      IDP_ISSUER_URL: ${KC_ISSUER:-http://localhost:8080/auth/realms/demo}
      # Web and panel tokens carry this client in their audience (the realm's
      # aud-demo-backend mapper), which is what kuloffice checks.
      IDP_CLIENT_ID: ${KC_BACKEND_CLIENT:-demo-backend}
      IDP_CLIENT_SECRET: ${KC_BACKEND_SECRET:-demo-backend-secret}
      # Staff: the workforce realm, its own provider (no shared issuer with customers).
      WORKFORCE_ISSUER_URL: ${KC_WORKFORCE_ISSUER:-http://localhost:8080/auth/realms/workforce}
      WORKFORCE_CLIENT_ID: kuloffice
      WORKFORCE_CLIENT_SECRET: ${KC_WORKFORCE_SECRET:-kuloffice-workforce-secret}

  # Makes the workforce realm's demo user a reviewer: operator, identity
  # binding and role. Before anyone signs in as them; see stack/seed_reviewer.py.
  reviewer-seed:
    # A local kuloffice, with the local Keycloak or (SERVER_KC_ADMIN_PASSWORD)
    # the server's: there it only looks your staff account up.
    profiles: ["seed"]
    image: python:3.12-alpine
    network_mode: service:net
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    volumes:
      - ./stack/seed_reviewer.py:/stack/seed_reviewer.py:ro
    command: ["python3", "/stack/seed_reviewer.py"]
    environment:
      KEYCLOAK_URL: ${KC_PUBLIC:-http://localhost:8080/auth}
      WORKFORCE_ISSUER: ${KC_WORKFORCE_ISSUER:-http://localhost:8080/auth/realms/workforce}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KULOFFICE_URL: http://localhost:${KULOFFICE_PORT:-18080}
      KULOFFICE_ADMIN_EMAIL: ${KULOFFICE_ADMIN_EMAIL:-admin@kulpay.local}
      KULOFFICE_ADMIN_PASSWORD: ${KULOFFICE_ADMIN_PASSWORD:-localadmin}
      REVIEWER_EMAIL: ${SEED_EMAIL:-reviewer@kulpay.local}

  # ---- clients ----------------------------------------------------------------

  web:
    build:
      context: ${WEB_DIR:-../kulpay-web}
      dockerfile_inline: |
        # syntax=docker/dockerfile:1
        FROM node:22-alpine3.20 AS build
        WORKDIR /app
        ENV NEXT_TELEMETRY_DISABLED=1
        COPY package.json package-lock.json ./
        RUN --mount=type=cache,target=/root/.npm npm ci
        # The build type-checks the tests too, whose matchers vitest.setup.ts declares.
        COPY next.config.ts tsconfig.json postcss.config.mjs vitest.config.mts vitest.setup.ts ./
        COPY messages ./messages
        COPY public ./public
        COPY src ./src
        RUN npm run build
        FROM node:22-alpine3.20
        WORKDIR /app
        ENV NODE_ENV=production NEXT_TELEMETRY_DISABLED=1
        COPY --from=build --chown=node:node /app ./
        USER node
        CMD ["node_modules/.bin/next", "start"]
    image: ${WEB_REF:-kulstack-web:local}
    profiles: ["web"]
    network_mode: service:net
    restart: unless-stopped
    depends_on:
      kuloffice: { condition: service_started, required: false }
      realm-setup: { condition: service_completed_successfully, required: false }
    environment:
      PORT: ${WEB_PORT:-3000}
      KULPAY_WEB_URL: http://localhost:${WEB_PORT:-3000}
      # The local demo realm or the server's, the local kuloffice or core.
      KULPAY_KEYCLOAK_ISSUER: ${KC_ISSUER:-http://localhost:8080/auth/realms/demo}
      KULPAY_KEYCLOAK_CLIENT_ID: kulpay-web
      KULPAY_KEYCLOAK_PASSKEY_CLIENT_ID: kulpay-web-passkey
      KULPAY_API_URL: ${API_URL:-http://localhost:18080}
      KULPAY_SESSION_SECRET: ${KULPAY_SESSION_SECRET:-}

  # The review portal (kulportal2): reviewers sign in to the workforce realm
  # and work kuloffice's review queue. http://localhost:${PORTAL_PORT}.
  portal:
    build:
      context: ${PORTAL_DIR:-../kulportal2}
    image: ${PORTAL_REF:-kulstack-portal:local}
    profiles: ["portal"]
    network_mode: service:net
    restart: unless-stopped
    depends_on:
      kuloffice: { condition: service_started, required: false }
      realm-setup: { condition: service_completed_successfully, required: false }
    environment:
      PORT: ${PORTAL_PORT:-3100}
      HOSTNAME: 0.0.0.0
      KULOFFICE_URL: http://localhost:${KULOFFICE_PORT:-18080}
      OIDC_ISSUER: http://localhost:${KC_PORT:-8080}/auth/realms/workforce
      OIDC_CLIENT_ID: kulportal
      OIDC_CLIENT_SECRET: ${PORTAL_CLIENT_SECRET:-kulportal-local-secret}
      PORTAL_URL: http://localhost:${PORTAL_PORT:-3100}
      SESSION_SECRET: ${PORTAL_SESSION_SECRET:-local-portal-session-secret-change-me-0123456789}

  # Signs numbers in and keeps their tokens fresh: http://localhost:${PANEL_PORT}.
  token-panel:
    profiles: ["panel"]
    image: python:3.12-alpine
    network_mode: service:net
    restart: unless-stopped
    # With a local Keycloak, or PANEL=on: it signs in to whichever Keycloak you
    # name in it.
    depends_on:
      realm-setup: { condition: service_completed_successfully, required: false }
    command: ["python3", "/stack/token-panel.py"]
    volumes:
      - ${INTAKA_DIR:-../keycloak-phone-authenticator}/demo/token-panel:/src:ro
      - ./stack/token-panel.py:/stack/token-panel.py:ro
      - token-panel-data:/panel
    environment:
      PANEL_PORT: ${PANEL_PORT:-8765}
      INBOX_URL: http://sms-inbox:8080/api/dev/inbox
      PANEL_API_BASES: ${API_URL:-http://localhost:18080}

volumes:
  db-data:
  minio-data:
  token-panel-data:
